services:
  mongodb:
    image: mongo:7.0
    container_name: gastos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=gastos
    networks:
      - gastos-network

  redis:
    image: redis:7-alpine
    container_name: gastos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gastos-network
    command: redis-server --appendonly yes

  # Ollama - Servicio opcional para LLM local
  # Descomenta las siguientes líneas si quieres usar Ollama
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: gastos-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - gastos-network
  #   # Descomentar si tienes GPU NVIDIA
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastos-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/gastos
      - REDIS_URL=redis://redis:6379
      - BULK_STORAGE_DIR=/data/bulk
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - mongodb
      - redis
      # - ollama  # Descomenta si usas Ollama
    volumes:
      - bulk_data:/data/bulk
      - ./backend:/app
      - /app/node_modules
    networks:
      - gastos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gastos-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gastos-network

networks:
  gastos-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  # ollama_data:  # Descomenta si usas Ollama
  #   driver: local

  bulk_data:
    driver: local
